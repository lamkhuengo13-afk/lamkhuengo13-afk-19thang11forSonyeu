
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fbf6ec">
    <title>For Sơn iu cụa em ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px 12px 35px;
            background-color: #fbf6ec;
            font-family: Arial, sans-serif;
        }

        .card-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        .card-page {
            width: 100%;
            margin-bottom: 12px;
        }

        .card-page img {
            display: block;
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        /* Khu vực mã QR ở cuối trang 3 */
        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 15px 30px;
            margin-top: 5px;
            background-color: #fbf6ec;
            text-align: center;
        }

        .qr-overlay {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            background: #fbf6ec;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            border: 2px dashed #79222c;
        }

        .qr-overlay img {
            display: block;
            width: 150px;
            height: 150px;
            border-radius: 8px;
        }

        .qr-text {
            font-size: 14px;
            color: #79222c;
            margin-top: 10px;
            font-weight: 600;
            line-height: 1.5;
        }

        .qr-subtext {
            color: #8b6560;
            font-size: 12px;
            margin-top: 5px;
        }

        @media (min-width: 768px) {
            body {
                padding-top: 30px;
            }

            .card-container {
                max-width: 520px;
            }

            .qr-overlay img {
                width: 170px;
                height: 170px;
            }
        }

        @media (max-width: 360px) {
            body {
                padding: 10px 6px 25px;
            }

            .qr-overlay img {
                width: 135px;
                height: 135px;
            }
        }
    </style>
</head>

<body>

    <main class="card-container">

        <!-- TRANG 1 -->
        <section class="card-page">
            <img src="thiep1.png" alt="Trang 1 - Bìa thiệp">
        </section>

        <!-- TRANG 2 -->
        <section class="card-page">
            <img src="thiep2.png" alt="Trang 2 - Lời chúc">
        </section>

        <!-- TRANG 3 -->
        <section class="card-page">
            <img src="thiep3.png" alt="Trang 3 - Trang kết">
        </section>

        <!-- MÃ QR CUỐI THIỆP -->
        <section class="qr-section">
            <div class="qr-overlay">
                <img
                    src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https%3A%2F%2Flamkhuengo13-afk.github.io%2Flamkhuengo13-afk-19thang11forSonyeu%2Flove.html"
                    alt="Quét mã QR để mở món quà bí mật">
                <div class="qr-text">Quét
