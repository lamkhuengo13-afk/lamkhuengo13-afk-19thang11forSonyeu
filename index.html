```html
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fbf6ec">
    <title>For Sơn iu cụa em ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px 12px 35px;
            background-color: #fbf6ec;
            font-family: Arial, sans-serif;
        }

        .card-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        .card-page {
            width: 100%;
            margin-bottom: 12px;
        }

        .card-page > img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Trang 3 là khung chứa mã QR */
        .page-3 {
            position: relative;
        }

        .qr-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30%;
            max-width: 150px;
            min-width: 95px;
            padding: 8px;
            background: #fbf6ec;
            border: 2px dashed #79222c;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
            z-index: 2;
        }

        .qr-overlay img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 6px;
        }

        .qr-text {
            color: #79222c;
            font-size: clamp(9px, 2.5vw, 13px);
            font-weight: 600;
            margin-top: 5px;
            line-height: 1.4;
        }

        @media (min-width: 768px) {
            .card-container {
                max-width: 520px;
            }
        }

        @media (max-width: 360px) {
            body {
                padding: 10px 6px 25px;
            }

            .qr-overlay {
                width: 32%;
                min-width: 85px;
                padding: 5px;
            }
        }
    </style>
</head>

<body>

    <main class="card-container">

        <!-- TRANG 1 -->
        <section class="card-page">
            <img src="thiep1.png" alt="Trang 1 - Bìa thiệp">
        </section>

        <!-- TRANG 2 -->
        <section class="card-page">
            <img src="thiep2.png" alt="Trang 2 - Lời chúc">
        </section>

        <!-- TRANG 3 + MÃ QR Ở CHÍNH GIỮA -->
        <section class="card-page page-3">
            <img src="thiep3.png" alt="Trang 3 - Trang kết">

            <div class="qr-overlay">
                <img
                    src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https%3A%2F%2Flamkhuengo13-afk.github.io%2Flamkhuengo13-afk-19thang11forSonyeu%2Flove.html"
                    alt="Mã QR mở món quà bí mật">

                <div class="qr-text">
                    Quét đi anh ạ ❤️
                </div>
            </div>
        </section>

    </main>

</body>
</html>
```
