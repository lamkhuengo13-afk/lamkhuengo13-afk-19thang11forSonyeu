<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Sơn iu cụa em ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #fbf6ec;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card-container {
            position: relative;
            width: 100%;
            max-width: 480px;
        }

        .card-container img.main-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Khung mã QR tệp vào phong thư trên thiệp */
        .qr-overlay {
            position: absolute;
            bottom: 11%;  /* Chỉnh số này nếu muốn dịch lên/xuống cho khớp miệng phong thư */
            left: 50%;
            transform: translateX(-50%);
            
            background: #fbf6ec;
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
            border: 2px dashed #79222c;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .qr-overlay:hover {
            transform: translateX(-50%) scale(1.05);
        }

        .qr-overlay img {
            width: 100px;
            height: 100px;
            display: block;
            border-radius: 8px;
        }

        .qr-text {
            font-size: 0.75rem;
            color: #79222c;
            margin-top: 5px;
            font-weight: 600;
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Ảnh thiết kế thiệp gốc của em -->
        <img src="thiep.png" alt="Thiệp Happy Boy's Day" class="main-img">

        <!-- Mã QR tự động tạo và trỏ trực tiếp đến trang love.html trên GitHub Pages của em -->
        <div class="qr-overlay">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://lamkhuengo13-afk.github.io/19thang11forSonyeu/love.html" alt="QR Code">
            <div class="qr-text">Quét đi anh ạ ❤️</div>
        </div>
    </div>

</body>
</html>
