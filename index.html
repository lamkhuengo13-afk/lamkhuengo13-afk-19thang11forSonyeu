<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fbf6ec">
    <title>For Sơn iu cụa em ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px 12px 35px;
            background: #fbf6ec;
            font-family: Georgia, 'Times New Roman', serif;
        }

        .card-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        .card-page {
            width: 100%;
            margin-bottom: 12px;
        }

        .card-page > img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* QR nằm giữa trang 3 */
        .page-3 {
            position: relative;
        }

        /* Khung tem thư */
        .qr-stamp {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 38%;
            max-width: 180px;
            min-width: 120px;
            padding: 9px;
            background: #fff9ed;
            border: 2px dashed #a64b52;
            border-radius: 13px;
            box-shadow: 0 5px 18px rgba(65, 15, 25, 0.22);
            text-align: center;
            z-index: 2;
        }

        .stamp-inner {
            border: 1px solid rgba(121, 34, 44, 0.25);
            border-radius: 8px;
            padding: 9px 7px 8px;
        }

        .stamp-heading {
            color: #79222c;
            font-size: clamp(7px, 1.9vw, 10px);
            font-weight: bold;
            letter-spacing: 1.2px;
            line-height: 1.5;
            margin-bottom: 7px;
        }

        .stamp-heart {
            color: #b94d60;
            font-size: 15px;
            margin-bottom: 5px;
        }

        /* QR: giữ nguyên hình vuông, không bo méo */
        .qr-code {
            display: block;
            width: 100%;
            max-width: 125px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
            padding: 5px;
            background: #fff;
            border: 1px solid #ead7c9;
            border-radius: 5px;
        }

        .stamp-caption {
            color: #79222c;
            font-size: clamp(9px, 2.5vw, 12px);
            font-weight: bold;
            margin-top: 8px;
            line-height: 1.4;
        }

        .stamp-footer {
            color: #a87976;
            font-size: clamp(7px, 1.8vw, 9px);
            margin-top: 4px;
            font-style: italic;
        }

        .stamp-decoration {
            color: #c77b83;
            font-size: 11px;
            margin-top: 5px;
            letter-spacing: 5px;
        }

        @media (min-width: 768px) {
            .card-container {
                max-width: 520px;
            }
        }

        @media (max-width: 360px) {
            body {
                padding: 10px 6px 25px;
            }

            .qr-stamp {
                width: 40%;
                min-width: 105px;
                padding: 6px;
            }

            .stamp-inner {
                padding: 7px 5px;
            }
        }
    </style>
</head>

<body>

    <main class="card-container">

        <!-- TRANG 1 -->
        <section class="card-page">
            <img src="thiep1.png" alt="Trang 1 - Bìa thiệp">
        </section>

        <!-- TRANG 2 -->
        <section class="card-page">
            <img src="thiep2.png" alt="Trang 2 - Lời chúc">
        </section>

        <!-- TRANG 3 + QR TEM THƯ -->
        <section class="card-page page-3">
            <img src="thiep3.png" alt="Trang 3 - Trang kết">

            <div class="qr-stamp">
                <div class="stamp-inner">

                    <div class="stamp-heading">
                        A LITTLE SURPRISE<br>FOR YOU
                    </div>

                    <div class="stamp-heart">♥</div>

                    <img
                        class="qr-code"
                        src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&color=121212&bgcolor=FFFFFF&data=https%3A%2F%2Flamkhuengo13-afk.github.io%2Flamkhuengo13-afk-19thang11forSonyeu%2Flove.html"
                        alt="Quét mã QR để mở món quà bí mật">

                    <div class="stamp-caption">
                        Scan me, my love ♡
                    </div>

                    <div class="stamp-footer">
                        Made with love, just for you
                    </div>

                    <div class="stamp-decoration">
                        ♥ ♡ ♥
                    </div>

                </div>
            </div>
        </section>

    </main>

</body>
</html>
