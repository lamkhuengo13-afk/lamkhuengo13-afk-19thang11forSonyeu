<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4b1119">
    <title>For Sơn iu cụa em ❤️</title>

    <style>
        /* ===== CÀI ĐẶT CHUNG ===== */
        * {
            box-sizing: border-box;
        }

        html {
            width: 100%;
            min-height: 100%;
            overflow: hidden;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            min-height: 100svh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(
                    circle at center,
                    #6b1d26 0%,
                    #2c090d 100%
                );

            font-family: Georgia, serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Hiệu ứng hạt bụi vintage */
        body::after {
            content: "";
            position: fixed;
            inset: 0;

            background-image:
                radial-gradient(
                    rgba(251, 246, 236, 0.05) 1px,
                    transparent 0
                );

            background-size: 20px 20px;
            pointer-events: none;
            z-index: 2;
        }

        /* ===== KHU VỰC HOA VÀ ẢNH BAY ===== */
        .floating-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;

            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .float-item {
            position: absolute;
            bottom: -150px;

            animation: riseUp linear forwards;

            user-select: none;
            -webkit-user-select: none;
            will-change: transform, opacity;
        }

        /* ===== KHUNG ẢNH POLAROID ===== */
        .polaroid-frame {
            background: #fbf6ec;
            padding: 6px 6px 17px;
            border-radius: 4px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.5);

            border: 1px solid #e2d2be;
        }

        .polaroid-frame img {
            display: block;

            width: clamp(58px, 8vw, 80px);
            height: clamp(58px, 8vw, 80px);

            object-fit: cover;
            filter: sepia(15%) contrast(105%);
        }

        /* ===== STICKER VINTAGE ===== */
        .vintage-sticker {
            display: block;
            max-width: 78px;
            height: auto;
            object-fit: contain;

            filter:
                drop-shadow(0 5px 12px rgba(0, 0, 0, 0.4));
        }

        /* ===== ANIMATION BAY LÊN ===== */
        @keyframes riseUp {
            0% {
                transform:
                    translateY(0)
                    translateX(0)
                    rotate(var(--start-rot))
                    scale(0.7);

                opacity: 0;
            }

            15% {
                opacity: 0.95;
            }

            85% {
                opacity: 0.9;
            }

            100% {
                transform:
                    translateY(-115vh)
                    translateX(var(--tilt-drift))
                    rotate(var(--end-rot))
                    scale(1.05);

                opacity: 0;
            }
        }

        /* ===== BÓ HOA HỒNG CUỐI CÙNG ===== */
        #final-bouquet {
            position: fixed;
            left: 50%;
            top: 50%;
            z-index: 10;

            width: clamp(180px, 35vw, 330px);
            max-width: calc(100vw - 40px);

            max-height: 72vh;
            max-height: 72dvh;

            height: auto;
            object-fit: contain;

            border-radius: 18px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.7);

            border: 3px solid #fbf6ec;

            opacity: 0;

            transform:
                translate(-50%, -35%)
                scale(0.3);

            transition:
                opacity 1.8s ease,
                transform 1.8s cubic-bezier(
                    0.175, 0.885, 0.32, 1.275
                );

            pointer-events: none;
        }

        #final-bouquet.show {
            opacity: 1;

            transform:
                translate(-50%, -50%)
                scale(1);
        }

        /* ===== MÀN HÌNH CHÀO ===== */
        #welcome-overlay {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100vh;
            height: 100dvh;

            z-index: 100;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            padding:
                max(20px, env(safe-area-inset-top))
                max(20px, env(safe-area-inset-right))
                max(20px, env(safe-area-inset-bottom))
                max(20px, env(safe-area-inset-left));

            background: rgba(44, 9, 13, 0.92);

            transition: opacity 0.5s ease;
        }

        .welcome-box {
            width: 100%;
            max-width: 340px;
            margin: auto;

            background: #fbf6ec;

            padding: clamp(24px, 6vw, 34px)
                     clamp(18px, 6vw, 30px);

            border-radius: 16px;
            border: 2px dashed #79222c;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .welcome-box h3 {
            color: #79222c;
            margin-top: 0;
            margin-bottom: 12px;

            font-size: clamp(19px, 5vw, 23px);
            line-height: 1.4;
        }

        .welcome-box p {
            color: #555;

            font-size: clamp(13px, 3.5vw, 15px);
            line-height: 1.6;

            margin-bottom: 22px;
        }

        /* ===== NÚT MỞ QUÀ ===== */
        .unlock-btn {
            display: inline-block;
            max-width: 100%;

            background: #79222c;
            color: #fbf6ec;

            border: none;
            padding: 12px 22px;

            font-size: clamp(13px, 3.5vw, 15px);
            border-radius: 25px;

            cursor: pointer;
            font-family: Georgia, serif;

            box-shadow:
                0 4px 12px rgba(121, 34, 44, 0.4);

            transition: transform 0.2s ease;
        }

        .unlock-btn:active {
            transform: scale(0.95);
        }

        /* ===== ĐIỆN THOẠI ===== */
        @media (max-width: 600px) {
            .polaroid-frame {
                padding: 5px 5px 14px;
            }

            .polaroid-frame img {
                width: clamp(55px, 17vw, 72px);
                height: clamp(55px, 17vw, 72px);
            }

            #final-bouquet {
                width: min(72vw, 290px);
                max-height: 65dvh;
            }

            .float-item {
                bottom: -120px;
            }
        }

        /* ===== MÁY TÍNH BẢNG ===== */
        @media (min-width: 601px) and (max-width: 1024px) {
            #final-bouquet {
                width: min(40vw, 320px);
            }
        }

        /* ===== MÀN HÌNH RẤT THẤP ===== */
        @media (max-height: 500px) {
            .welcome-box {
                padding: 16px 22px;
            }

            .welcome-box p {
                margin-bottom: 12px;
            }

            #final-bouquet {
                max-height: 60dvh;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .unlock-btn {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <!-- MÀN HÌNH CHÀO -->
    <div id="welcome-overlay">
        <div class="welcome-box">
            <h3>For Sơn iu cụa em ❤️</h3>

            <p>
                Chạm vào nút bên dưới để mở hộp kỷ niệm
                và nhận quà nhé!
            </p>

            <button class="unlock-btn" id="startBtn" type="button">
                Thơm em mụt cái để mở
            </button>
        </div>
    </div>

    <!-- KHU VỰC HIỆU ỨNG -->
    <div class="floating-container" id="floatContainer"></div>

    <!-- BÓ HOA CUỐI CÙNG: ẢNH SỐ 6 -->
    <img
        src="6.jpg"
        id="final-bouquet"
        alt="Bó hoa hồng tặng Sơn"
    >

    <script>
        const container = document.getElementById('floatContainer');
        const startBtn = document.getElementById('startBtn');
        const overlay = document.getElementById('welcome-overlay');
        const finalBouquet = document.getElementById('final-bouquet');

        /* ===== ẢNH CỦA HAI ĐỨA =====
           Mỗi ảnh xuất hiện 2 lần trong danh sách.
        */
        const photos = [
            '0c606106d6f356ad0fe2.jpg',
            '80420604b1f131af68e0.jpg',
            '9b061040a7b527eb7ea4.jpg',
            'a1dfcdb97a4cfa12a35d.jpg',

            '0c606106d6f356ad0fe2.jpg',
            '80420604b1f131af68e0.jpg',
            '9b061040a7b527eb7ea4.jpg',
            'a1dfcdb97a4cfa12a35d.jpg'
        ];

        /* ===== STICKER VÀ HOA =====
           Sử dụng ảnh 1-5 và 7-18.
           Mỗi ảnh được nhân đôi trong danh sách.
           Ảnh 6 dành riêng cho bó hoa cuối cùng.
        */
        const stickers = [
            '1.jpg', '2.jpg', '3.jpg', '4.jpg', '5.jpg',
            '7.jpg', '8.jpg', '9.jpg', '10.jpg', '11.jpg',
            '12.jpg', '13.jpg', '14.jpg', '15.jpg', '16.jpg',
            '17.jpg', '18.jpg',

            '1.jpg', '2.jpg', '3.jpg', '4.jpg', '5.jpg',
            '7.jpg', '8.jpg', '9.jpg', '10.jpg', '11.jpg',
            '12.jpg', '13.jpg', '14.jpg', '15.jpg', '16.jpg',
            '17.jpg', '18.jpg'
        ];

        let currentTilt = 0;
        let spawnInterval = null;
        let started = false;

        const MAX_ITEMS = 45;

        /* ===== CẢM BIẾN NGHIÊNG ĐIỆN THOẠI ===== */
        function initSensors() {
            if (!window.DeviceOrientationEvent) return;

            if (
                typeof DeviceOrientationEvent.requestPermission === 'function'
            ) {
                DeviceOrientationEvent.requestPermission()
                    .then(permission => {
                        if (permission === 'granted') {
                            enableOrientation();
                        }
                    })
                    .catch(() => {});
            } else {
                enableOrientation();
            }
        }

        function enableOrientation() {
            window.addEventListener('deviceorientation', (e) => {
                if (e.gamma !== null) {
                    currentTilt = Math.max(
                        -40,
                        Math.min(40, e.gamma * 2)
                    );
                }
            });
        }

        /* ===== TẠO ẢNH VÀ STICKER BAY ===== */
        function createItem(typeHint = null) {
            if (container.childElementCount >= MAX_ITEMS) return;

            const item = document.createElement('div');
            item.classList.add('float-item');

            const isPhoto =
                typeHint !== null
                    ? typeHint
                    : Math.random() < 0.30;

            if (isPhoto) {
                const frame = document.createElement('div');
                frame.classList.add('polaroid-frame');

                const img = document.createElement('img');

                img.src =
                    photos[Math.floor(Math.random() * photos.length)];

                img.alt = 'Kỷ niệm của hai đứa';

                frame.appendChild(img);
                item.appendChild(frame);

            } else {
                const img = document.createElement('img');

                img.src =
                    stickers[Math.floor(Math.random() * stickers.length)];

                img.classList.add('vintage-sticker');
                img.alt = '';

                const size = Math.random() * 5 + 10;

                img.style.width =
                    `clamp(42px, ${size}vw, 78px)`;

                item.appendChild(img);
            }

            /* Vị trí ngẫu nhiên theo chiều ngang */
            item.style.left = (Math.random() * 84 + 5) + 'vw';

            const startRot =
                (Math.random() * 40 - 20) + 'deg';

            const endRot =
                (Math.random() * 90 - 45) + 'deg';

            const totalDrift =
                (Math.random() * 50 - 25 + currentTilt) + 'px';

            item.style.setProperty('--start-rot', startRot);
            item.style.setProperty('--end-rot', endRot);
            item.style.setProperty('--tilt-drift', totalDrift);

            const duration = Math.random() * 3 + 4.5;

            item.style.animationDuration = duration + 's';

            container.appendChild(item);

            setTimeout(() => {
                item.remove();
            }, duration * 1000);
        }

        /* ===== BẮT ĐẦU MỞ HỘP KỶ NIỆM ===== */
        startBtn.addEventListener('click', () => {
            if (started) return;
            started = true;

            initSensors();

            overlay.style.opacity = '0';
            overlay.style.pointerEvents = 'none';

            setTimeout(() => {
                overlay.remove();
            }, 500);

            /* Ảnh và sticker bay liên tục */
            spawnInterval = setInterval(() => {
                createItem();
            }, 220);

            /* Những ảnh đầu tiên xuất hiện ngay */
            for (let i = 0; i < 10; i++) {
                setTimeout(() => {
                    createItem(i % 2 === 0);
                }, i * 90);
            }

            /* Kết thúc màn bung hoa */
            setTimeout(() => {
                clearInterval(spawnInterval);

                /* Đợi hiệu ứng bay dịu xuống rồi hiện bó hoa */
                setTimeout(() => {
                    finalBouquet.classList.add('show');
                }, 1500);

            }, 5500);
        });

        /* ===== CHẠM MÀN HÌNH ĐỂ TẠO THÊM ẢNH ===== */
        window.addEventListener('pointerdown', () => {
            if (!started) return;

            if (container.childElementCount >= MAX_ITEMS - 4) return;

            for (let i = 0; i < 4; i++) {
                setTimeout(() => {
                    createItem(i % 2 === 0);
                }, i * 70);
            }
        });
    </script>

</body>
</html>
