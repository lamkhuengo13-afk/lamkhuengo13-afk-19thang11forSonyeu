<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4b1119">
    <title>For Sơn iu cụa em ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            width: 100%;
            min-height: 100%;
            overflow: hidden;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            min-height: 100svh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at center, #6b1d26 0%, #2c090d 100%);

            font-family: Georgia, serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Bụi vintage */
        body::after {
            content: "";
            position: fixed;
            inset: 0;

            background-image:
                radial-gradient(rgba(251, 246, 236, 0.05) 1px, transparent 0);

            background-size: 20px 20px;
            pointer-events: none;
            z-index: 2;
        }

        /* Khu vực ảnh bay */
        .floating-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;

            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .float-item {
            position: absolute;
            bottom: -150px;

            animation: riseUp linear forwards;

            user-select: none;
            -webkit-user-select: none;
            will-change: transform, opacity;
        }

        /* Ảnh đôi Polaroid - kích thước lớn hơn */
        .polaroid-frame {
            background: #fbf6ec;
            padding: 8px 8px 21px;
            border-radius: 4px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #e2d2be;
        }

        .polaroid-frame img {
            display: block;

            width: clamp(90px, 11vw, 120px);
            height: clamp(90px, 11vw, 120px);

            object-fit: cover;
            filter: sepia(15%) contrast(105%);
        }

        /* Sticker vintage - tăng kích thước */
        .vintage-sticker {
            display: block;
            max-width: 110px;
            height: auto;
            object-fit: contain;

            filter: drop-shadow(0 5px 12px rgba(0, 0, 0, 0.4));
        }

        /* Ảnh bay lên */
        @keyframes riseUp {
            0% {
                transform:
                    translateY(0)
                    translateX(0)
                    rotate(var(--start-rot))
                    scale(0.7);

                opacity: 0;
            }

            15% {
                opacity: 0.95;
            }

            85% {
                opacity: 0.9;
            }

            100% {
                transform:
                    translateY(-115vh)
                    translateX(var(--tilt-drift))
                    rotate(var(--end-rot))
                    scale(1.05);

                opacity: 0;
            }
        }

        /* Màn hình chào */
        #welcome-overlay {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100vh;
            height: 100dvh;

            z-index: 100;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            padding:
                max(20px, env(safe-area-inset-top))
                max(20px, env(safe-area-inset-right))
                max(20px, env(safe-area-inset-bottom))
                max(20px, env(safe-area-inset-left));

            background: rgba(44, 9, 13, 0.92);
            transition: opacity 0.5s ease;
        }

        .welcome-box {
            width: 100%;
            max-width: 340px;
            margin: auto;

            background: #fbf6ec;

            padding: clamp(24px, 6vw, 34px)
                     clamp(18px, 6vw, 30px);

            border-radius: 16px;
            border: 2px dashed #79222c;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .welcome-box h3 {
            color: #79222c;
            margin-top: 0;
            margin-bottom: 12px;

            font-size: clamp(19px, 5vw, 23px);
            line-height: 1.4;
        }

        .welcome-box p {
            color: #555;
            font-size: clamp(13px, 3.5vw, 15px);
            line-height: 1.6;
            margin-bottom: 22px;
        }

        .unlock-btn {
            display: inline-block;
            max-width: 100%;

            background: #79222c;
            color: #fbf6ec;

            border: none;
            padding: 12px 22px;

            font-size: clamp(13px, 3.5vw, 15px);
            border-radius: 25px;

            cursor: pointer;
            font-family: Georgia, serif;

            box-shadow: 0 4px 12px rgba(121, 34, 44, 0.4);
            transition: transform 0.2s ease;
        }

        .unlock-btn:active {
            transform: scale(0.95);
        }

        /* ===== THIỆP KẾT THÚC VINTAGE ===== */
        #final-message {
            position: fixed;
            left: 50%;
            top: 50%;

            z-index: 20;

            width: min(88vw, 460px);
            padding: 11px;

            background: #e8d8bd;
            border: 1px solid #c4a77f;
            border-radius: 4px;

            box-shadow:
                0 20px 55px rgba(0, 0, 0, 0.55),
                0 0 0 5px rgba(232, 216, 189, 0.1);

            opacity: 0;

            transform:
                translate(-50%, -42%)
                scale(0.88);

            pointer-events: none;

            transition:
                opacity 1.5s ease,
                transform 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #final-message.show {
            opacity: 1;

            transform:
                translate(-50%, -50%)
                scale(1);
        }

        .message-inner {
            position: relative;
            overflow: hidden;

            text-align: center;

            padding: clamp(30px, 7vw, 44px)
                     clamp(18px, 6vw, 34px);

            background:
                radial-gradient(circle at center, #fffaf0 0%, #f2e5ce 100%);

            border: 1px solid #b99570;
            outline: 1px solid rgba(121, 34, 44, 0.3);
            outline-offset: -7px;
        }

        /* Họa tiết nền nhẹ */
        .message-inner::before {
            content: "✧";
            position: absolute;
            top: 48%;
            left: 50%;

            transform: translate(-50%, -50%);

            color: rgba(164, 125, 89, 0.08);
            font-size: 180px;
            pointer-events: none;
        }

        .message-content {
            position: relative;
            z-index: 1;
        }

        .message-top {
            color: #9b7657;
            font-size: 10px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 17px;
        }

        .message-ornament {
            color: #a47d59;
            font-size: 17px;
            letter-spacing: 5px;
            margin-bottom: 13px;
        }

        .message-heart {
            display: flex;
            justify-content: center;
            align-items: center;

            width: 43px;
            height: 43px;

            margin: 0 auto 19px;

            border: 1px solid #c7a27f;
            border-radius: 50%;

            color: #8e2935;
            font-size: 20px;

            background: rgba(255, 250, 240, 0.7);
            box-shadow: 0 3px 10px rgba(121, 34, 44, 0.1);
        }

        /* Lời chúc chính */
        .message-title {
            color: #79222c;

            font-family: Georgia, serif;
            font-weight: bold;
            font-style: italic;

            font-size: clamp(27px, 7.5vw, 39px);
            line-height: 1.35;

            margin: 0 auto;

            text-shadow: 1px 1px 0 #ead7b8;
        }

        .message-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;

            margin: 22px 0 17px;

            color: #a47d59;
            font-size: 13px;
        }

        .message-divider::before,
        .message-divider::after {
            content: "";
            width: 45px;
            height: 1px;
            background: #c8a987;
        }

        /* Câu nhắn phụ */
        .message-note {
            color: #795b47;

            font-family: Georgia, serif;
            font-style: italic;

            font-size: clamp(14px, 4vw, 17px);
            line-height: 1.7;

            margin: 0 auto;
            max-width: 310px;
        }

        .message-bottom {
            color: #a08060;

            font-size: 9px;
            letter-spacing: 2.5px;

            margin-top: 22px;
        }

        .corner-decoration {
            position: absolute;
            color: #a47d59;
            font-size: 20px;
            opacity: 0.8;
        }

        .corner-decoration.top-left {
            top: 12px;
            left: 15px;
        }

        .corner-decoration.top-right {
            top: 12px;
            right: 15px;
        }

        .corner-decoration.bottom-left {
            bottom: 12px;
            left: 15px;
        }

        .corner-decoration.bottom-right {
            bottom: 12px;
            right: 15px;
        }

        /* Điện thoại */
        @media (max-width: 600px) {
            .polaroid-frame {
                padding: 7px 7px 18px;
            }

            .polaroid-frame img {
                width: clamp(78px, 21vw, 100px);
                height: clamp(78px, 21vw, 100px);
            }

            .vintage-sticker {
                max-width: 92px;
            }

            .float-item {
                bottom: -120px;
            }

            #final-message {
                width: min(91vw, 390px);
            }

            .message-inner {
                padding: 32px 19px;
            }

            .message-top {
                letter-spacing: 3px;
            }

            .message-title {
                font-size: clamp(27px, 8vw, 34px);
            }
        }

        /* Máy tính bảng */
        @media (min-width: 601px) and (max-width: 1024px) {
            #final-message {
                width: min(78vw, 430px);
            }

            .polaroid-frame img {
                width: 110px;
                height: 110px;
            }
        }

        /* Màn hình thấp */
        @media (max-height: 500px) {
            .welcome-box {
                padding: 16px 22px;
            }

            .welcome-box p {
                margin-bottom: 12px;
            }

            .message-inner {
                padding: 18px 20px;
            }

            .message-top {
                margin-bottom: 8px;
            }

            .message-heart {
                margin-bottom: 8px;
                width: 34px;
                height: 34px;
            }

            .message-divider {
                margin: 10px 0;
            }

            .message-bottom {
                margin-top: 10px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .unlock-btn {
                transition: none;
            }

            #final-message {
                transition: opacity 0.5s ease;
            }
        }
    </style>
</head>

<body>

    <!-- MÀN HÌNH CHÀO -->
    <div id="welcome-overlay">
        <div class="welcome-box">
            <h3>For Sơn iu cụa em ❤️</h3>

            <p>
                Chạm vào nút bên dưới để mở nhé!
            </p>

            <button class="unlock-btn" id="startBtn" type="button">
                Thơm em mụt cái để mở
            </button>
        </div>
    </div>

    <!-- KHU VỰC ẢNH BAY -->
    <div class="floating-container" id="floatContainer"></div>

    <!-- THIỆP LỜI NHẮN CUỐI CÙNG -->
    <div id="final-message">
        <div class="message-inner">

            <span class="corner-decoration top-left">❧</span>
            <span class="corner-decoration top-right">❧</span>
            <span class="corner-decoration bottom-left">❧</span>
            <span class="corner-decoration bottom-right">❧</span>

            <div class="message-content">

                <div class="message-top">
                    A LITTLE LOVE LETTER
                </div>

                <div class="message-ornament">
                    ✦ &nbsp; ❦ &nbsp; ✦
                </div>

                <div class="message-heart">♥</div>

                <h1 class="message-title">
                    Chúc Sơn iu<br>
                    ăn thật ngon mịn nha ♡
                </h1>

                <div class="message-divider">
                    <span>✦</span>
                    <span>♡</span>
                    <span>✦</span>
                </div>

                <p class="message-note">
                    dệ thưn hăm, khen bé đi
                </p>

                <div class="message-bottom">
                    MADE WITH LOVE, JUST FOR YOU
                </div>

            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('floatContainer');
        const startBtn = document.getElementById('startBtn');
        const overlay = document.getElementById('welcome-overlay');
        const finalMessage = document.getElementById('final-message');

        /* ===== ẢNH CỦA HAI ĐỨA ===== */
        const photos = [
            '0c606106d6f356ad0fe2.jpg',
            '80420604b1f131af68e0.jpg',
            '9b061040a7b527eb7ea4.jpg',
            'a1dfcdb97a4cfa12a35d.jpg'
        ];

        /* ===== STICKER TỪ 1 ĐẾN 18 ===== */
        const stickers = [
            '1.jpg',
            '2.jpg',
            '3.jpg',
            '4.jpg',
            '5.jpg',
            '6.jpg',
            '7.jpg',
            '8.jpg',
            '9.jpg',
            '10.jpg',
            '11.jpg',
            '12.jpg',
            '13.jpg',
            '14.jpg',
            '15.jpg',
            '16.jpg',
            '17.jpg',
            '18.jpg'
        ];

        let currentTilt = 0;
        let started = false;

        const MAX_ITEMS = 45;
        const SPAWN_DELAY = 260;

        /* ===== CẢM BIẾN NGHIÊNG ĐIỆN THOẠI ===== */
        function initSensors() {
            if (!window.DeviceOrientationEvent) return;

            if (
                typeof DeviceOrientationEvent.requestPermission === 'function'
            ) {
                DeviceOrientationEvent.requestPermission()
                    .then(permission => {
                        if (permission === 'granted') {
                            enableOrientation();
                        }
                    })
                    .catch(() => {});
            } else {
                enableOrientation();
            }
        }

        function enableOrientation() {
            window.addEventListener('deviceorientation', (e) => {
                if (e.gamma !== null) {
                    currentTilt = Math.max(
                        -40,
                        Math.min(40, e.gamma * 2)
                    );
                }
            });
        }

        /* ===== TẠO DANH SÁCH ẢNH: MỖI ẢNH 2 LẦN ===== */
        function createImageQueue() {
            const queue = [];

            photos.forEach(src => {
                queue.push({ type: 'photo', src });
                queue.push({ type: 'photo', src });
            });

            stickers.forEach(src => {
                queue.push({ type: 'sticker', src });
                queue.push({ type: 'sticker', src });
            });

            /* Trộn ngẫu nhiên */
            for (let i = queue.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [queue[i], queue[j]] = [queue[j], queue[i]];
            }

            return queue;
        }

        /* ===== TẠO ẢNH VÀ STICKER BAY ===== */
        function createItem(entry) {
            if (container.childElementCount >= MAX_ITEMS) return;

            const item = document.createElement('div');
            item.classList.add('float-item');

            if (entry.type === 'photo') {
                const frame = document.createElement('div');
                frame.classList.add('polaroid-frame');

                const img = document.createElement('img');
                img.src = entry.src;
                img.alt = 'Kỷ niệm của hai đứa';

                frame.appendChild(img);
                item.appendChild(frame);

            } else {
                const img = document.createElement('img');

                img.src = entry.src;
                img.classList.add('vintage-sticker');
                img.alt = '';

                const size = Math.random() * 6 + 13;

                img.style.width =
                    `clamp(58px, ${size}vw, 110px)`;

                item.appendChild(img);
            }

            /* Vị trí ngẫu nhiên */
            item.style.left = (Math.random() * 84 + 5) + 'vw';

            const startRot =
                (Math.random() * 40 - 20) + 'deg';

            const endRot =
                (Math.random() * 90 - 45) + 'deg';

            const totalDrift =
                (Math.random() * 50 - 25 + currentTilt) + 'px';

            item.style.setProperty('--start-rot', startRot);
            item.style.setProperty('--end-rot', endRot);
            item.style.setProperty('--tilt-drift', totalDrift);

            const duration = Math.random() * 3 + 4.5;

            item.style.animationDuration = duration + 's';

            container.appendChild(item);

            setTimeout(() => {
                item.remove();
            }, duration * 1000);
        }

        /* ===== HIỆN LỜI NHẮN CUỐI ===== */
        function showFinalMessage() {
            finalMessage.classList.add('show');
        }

        /* ===== BẮT ĐẦU MỞ HỘP KỶ NIỆM ===== */
        startBtn.addEventListener('click', () => {
            if (started) return;
            started = true;

            initSensors();

            overlay.style.opacity = '0';
            overlay.style.pointerEvents = 'none';

            setTimeout(() => {
                overlay.remove();
            }, 500);

            const queue = createImageQueue();
            let index = 0;

            /* Ảnh đầu tiên xuất hiện ngay */
            createItem(queue[index]);
            index++;

            /* Những ảnh tiếp theo lần lượt bay lên */
            const spawnInterval = setInterval(() => {
                if (index >= queue.length) {
                    clearInterval(spawnInterval);

                    /*
                       Chờ ảnh cuối cùng bay hết
                       trước khi hiện tấm thiệp.
                    */
                    setTimeout(() => {
                        showFinalMessage();
                    }, 7600);

                    return;
                }

                createItem(queue[index]);
                index++;
            }, SPAWN_DELAY);
        });
    </script>

</body>
</html>
