<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Sơn iu cụa em ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #6b1d26 0%, #2c090d 100%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Georgia', serif;
        }

        body::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(rgba(251, 246, 236, 0.05) 1px, transparent 0);
            background-size: 20px 20px;
            pointer-events: none;
            z-index: 2;
        }

        .floating-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .float-item {
            position: absolute;
            bottom: -140px;
            animation: riseUp linear forwards;
            user-select: none;
            will-change: transform, opacity;
        }

        /* Khung ảnh Polaroid cho 4 bức ảnh đôi (x1) */
        .polaroid-frame {
            background: #fbf6ec;
            padding: 6px 6px 18px 6px;
            border-radius: 4px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #e2d2be;
        }

        .polaroid-frame img {
            width: 75px;
            height: 75px;
            object-fit: cover;
            display: block;
            filter: sepia(15%) contrast(105%);
        }

        /* Các sticker vintage bay nhỏ xinh xung quanh */
        .vintage-sticker {
            border-radius: 8px;
            filter: drop-shadow(0 5px 12px rgba(0,0,0,0.4));
            object-fit: contain;
        }

        @keyframes riseUp {
            0% {
                transform: translateY(0) translateX(0) rotate(var(--start-rot)) scale(0.7);
                opacity: 0;
            }
            15% {
                opacity: 0.95;
            }
            85% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-115vh) translateX(var(--tilt-drift)) rotate(var(--end-rot)) scale(1.05);
                opacity: 0;
            }
        }

        /* --- BÓ HOA HỒNG (6.jpg) KHỔNG LỒ CHỐT HẠ Ở GIỮA MÀN HÌNH --- */
        #final-bouquet {
            position: absolute;
            z-index: 10;
            width: 230px;
            height: auto;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
            border: 3px solid #fbf6ec;
            opacity: 0;
            transform: scale(0.3) translateY(120px);
            transition: all 1.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        #final-bouquet.show {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        /* Màn hình chào ban đầu */
        #welcome-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 9, 13, 0.92);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            transition: opacity 0.5s ease;
        }

        .welcome-box {
            background: #fbf6ec;
            padding: 30px 25px;
            border-radius: 16px;
            border: 2px dashed #79222c;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            max-width: 300px;
        }

        .welcome-box h3 {
            color: #79222c;
            margin-top: 0;
            font-size: 1.2rem;
        }

        .welcome-box p {
            color: #555;
            font-size: 0.85rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .unlock-btn {
            background: #79222c;
            color: #fbf6ec;
            border: none;
            padding: 10px 24px;
            font-size: 0.95rem;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Georgia', serif;
            box-shadow: 0 4px 12px rgba(121, 34, 44, 0.4);
            transition: transform 0.2s ease;
        }

        .unlock-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="welcome-overlay">
        <div class="welcome-box">
            <h3>For Sơn iu cụa em ❤️</h3>
            <p>Chạm vào nút bên dưới để mở hộp kỷ niệm và nhận quà nhé!</p>
            <button class="unlock-btn" id="startBtn">Thơm em mụt cái để mở</button>
        </div>
    </div>

    <div class="floating-container" id="floatContainer"></div>

    <!-- Bó hoa hồng lớn (6.jpg) xuất hiện chốt hạ ở giữa -->
    <img src="6.jpg" id="final-bouquet" alt="Bó hoa hồng tặng Sơn">

    <script>
        const container = document.getElementById('floatContainer');
        const startBtn = document.getElementById('startBtn');
        const overlay = document.getElementById('welcome-overlay');
        const finalBouquet = document.getElementById('final-bouquet');

        const photos = [
            '0c606106d6f356ad0fe2.jpg',
            '80420604b1f131af68e0.jpg',
            '9b061040a7b527eb7ea4.jpg',
            'a1dfcdb97a4cfa12a35d.jpg'
        ];

        const stickers = [
            '1.jpg', '2.jpg', '3.jpg', '4.jpg', '5.jpg', 
            '7.jpg', '8.jpg', '9.jpg', '10.jpg', '11.jpg', 
            '12.jpg', '13.jpg', '14.jpg', '15.jpg', '16.jpg', 
            '17.jpg', '18.jpg', '19.jpg', '20.jpg'
        ];

        let currentTilt = 0;

        function initSensors() {
            if (window.DeviceOrientationEvent) {
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission().catch(console.error);
                }
                window.addEventListener('deviceorientation', (e) => {
                    if (e.gamma !== null) {
                        currentTilt = e.gamma * 14;
                    }
                });
            }
        }

        function createItem(typeHint = null) {
            const item = document.createElement('div');
            item.classList.add('float-item');

            const isPhoto = typeHint !== null ? typeHint : (Math.random() < 0.30);

            if (isPhoto) {
                const frame = document.createElement('div');
                frame.classList.add('polaroid-frame');
                const img = document.createElement('img');
                img.src = photos[Math.floor(Math.random() * photos.length)];
                frame.appendChild(img);
                item.appendChild(frame);
            } else {
                const img = document.createElement('img');
                img.src = stickers[Math.floor(Math.random() * stickers.length)];
                img.classList.add('vintage-sticker');
                
                const size = Math.floor(Math.random() * 25 + 42);
                img.style.width = size + 'px';
                img.style.height = 'auto';
                item.appendChild(img);
            }

            item.style.left = (Math.random() * 88 + 2) + 'vw';

            const startRot = (Math.random() * 40 - 20) + 'deg';
            const endRot = (Math.random() * 90 - 45) + 'deg';
            const totalDrift = (Math.random() * 50 - 25) + currentTilt + 'px';
            
            item.style.setProperty('--start-rot', startRot);
            item.style.setProperty('--end-rot', endRot);
            item.style.setProperty('--tilt-drift', totalDrift);

            const duration = Math.random() * 3 + 4.5;
            item.style.animationDuration = duration + 's';

            container.appendChild(item);

            setTimeout(() => {
                item.remove();
            }, duration * 1000);
        }

        startBtn.addEventListener('click', () => {
            initSensors();
            overlay.style.opacity = '0';
            setTimeout(() => overlay.remove(), 500);

            let spawnInterval = setInterval(() => {
                createItem();
            }, 350);

            for (let i = 0; i < 6; i++) {
                setTimeout(() => createItem(i % 2 === 0), i * 100);
            }

            setTimeout(() => {
                clearInterval(spawnInterval);
                setTimeout(() => {
                    finalBouquet.classList.add('show');
                }, 1500);
            }, 5500);
        });

        window.addEventListener('pointerdown', () => {
            if (document.body.contains(overlay)) return;
            for (let i = 0; i < 4; i++) {
                setTimeout(() => createItem(i % 2 === 0), i * 70);
            }
        });
    </script>
</body>
</html>
